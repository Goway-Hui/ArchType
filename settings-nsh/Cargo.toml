[package]
name = "nsh-app-archtype"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
# 独立的空工作区：nsh 管这个 crate 的构建，不跟根工作区共用版本号、lockfile 与依赖解析

[dependencies]
nsh-core = "0.6.0"
nsh-base = "0.6.0"
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "3"
sha2 = "0.10"
