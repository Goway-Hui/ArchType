[package]
name = "archtype-config-cli"
version.workspace = true
edition = "2024"
# edition 2024 需要 Rust 1.85+；core 的 1.79 只约束它自己
rust-version = "1.85"
license.workspace = true
publish = false

[[bin]]
name = "archtype-config"
path = "src/main.rs"

[dependencies]
archtype-net = { path = "../net" }
serde_json = "1"
sha2 = "0.10"
