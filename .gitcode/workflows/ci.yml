# AtomGit Action（gitcode.com）轻量 CI：先验证平台是否开通/可用，再跑不依赖容器和真实词库的回归。
#
# 与 GitHub 的 .github/workflows/ci.yml 是两套独立配置，差异在这里：
#   - 插件名不带 actions/ 前缀：官方插件就是 `uses: checkout`
#   - 跨 step 传 PATH/环境变量写 $ATOMGIT_PATH / $ATOMGIT_ENV（未注入时脚本自己 export 兜底）
#   - runs-on 是三段式标签 {os},{arch},{flavor}，没有 macOS/Windows
#   - 文件必须在 .gitcode/workflows/，不是 .github/workflows/
#
# 只跑 installer + core。addon 的多发行版容器矩阵、data（rime-ice 克隆）、ranking-eval、
# 打 tag 发 Release、nix/telegram 这些仍然只在 GitHub 上跑。
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"
  workflow_dispatch:

jobs:
  smoke:
    name: 平台连通性
    runs-on: [ubuntu-latest, x64, slim]
    timeout-minutes: 10
    steps:
      - uses: checkout
      - name: 环境
        run: |
          echo "ref=${ATOMGIT_REF:-<unset>}"
          echo "sha=${ATOMGIT_SHA:-<unset>}"
          echo "event=${ATOMGIT_EVENT_NAME:-<unset>}"
          echo "repo=${ATOMGIT_REPOSITORY:-<unset>}"
          uname -a
          echo "cpu=$(nproc)"
          free -h || true
          df -h / || true
          git log -1 --oneline
          for t in git curl python3 cargo rustc cc sudo docker; do
            printf '%-8s %s\n' "$t" "$(command -v "$t" || echo '-')"
          done

  installer:
    name: 安装与更新回归
    needs: smoke
    runs-on: [ubuntu-latest, x64, small]
    timeout-minutes: 20
    steps:
      - uses: checkout
      - name: 脚本语法
        run: for script in install.sh scripts/*.sh; do bash -n "$script"; done
      # 无网络、无 root 的安装器回归（内部用夹具拦截 sudo/curl/apt）
      - name: 安装器回归
        run: bash scripts/test-install.sh
      # 设置契约：spec/ 自检 + 设置界面对照（fcitx5 插件在 GitHub 的 addon 任务里对照）
      - name: 设置契约
        run: python3 scripts/test-config-contract.py

  core:
    name: Rust 核心测试
    needs: smoke
    runs-on: [ubuntu-latest, x64, medium]
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: checkout
      - name: 系统依赖
        run: |
          SUDO=""
          # 托管 runner 是否为 root 未明确：有 sudo 就用，没有就直接装
          command -v sudo >/dev/null 2>&1 && SUDO=sudo
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libx11-dev libxkbcommon-dev \
            ca-certificates curl
      - name: Rust 工具链
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo -V
          rustc -V
          # 平台注入了 $ATOMGIT_PATH 就登记，没注入也不影响：后面每个 step 自己 export
          if [ -n "${ATOMGIT_PATH:-}" ]; then echo "$HOME/.cargo/bin" >> "$ATOMGIT_PATH"; fi
      - name: 五笔真码表
        # session_keys 的 wubi_real_table 测试要它；按钉死的 rime-wubi 提交从 GitHub 下载
        run: scripts/make-wubi.sh "" "$PWD/dist/wubi"
      - name: Rust 测试
        # 绝对路径：cargo test 的测试进程工作目录是包目录（core/），相对路径会找不到
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export ARCHTYPE_WUBI="$PWD/dist/wubi/wubi86.tsv"
          cargo test --workspace --locked
      - name: C ABI 冒烟
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ./scripts/abi-smoke.sh
