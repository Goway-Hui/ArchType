[package]
name = "archtype-macos"
version = "0.1.0"
edition = "2021"
publish = false
description = "ArchType 的 macOS 输入法外壳：IMKServer + IMKInputController（objc2），引擎、会话、设置都在 Rust 里"

# 独立 workspace：只在 macOS 上编，不跟根 workspace 的 Linux 构建设置混。
# 平台无关的模块（按键翻译、设置、会话驱动）在 Linux 上也能 `cargo test`。
[workspace]

[dependencies]
# 引擎、会话、候选、学习：和 Linux 插件同一套 Rust 实现，外壳不再经过 C FFI
archtype-core = { path = "../core", default-features = false, features = ["voice"] }
archtype-net = { path = "../net" }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-input-method-kit = "0.3"