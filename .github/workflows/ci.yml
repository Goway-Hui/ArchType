name: CI

# PR 和推送到 main、pre-release：验证安装器、更新器及各发行版构建，安装包保存在 Artifacts。
# pre-release 是下一版的集成分支：功能 PR 先合进这里，攒够了再整体合进 main 发版。
# 只改了文档（*.md、docs/、截图）的提交不跑。
# 推送 v* 标签（git tag v0.1.0 && git push origin v0.1.0）：总是跑，并把这些包发到 GitHub Release。
# 其他分支想跑一次：Actions 页手动运行（workflow_dispatch）。

on:
  push:
    branches: [main, pre-release]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: 格式与静态检查
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 系统依赖
        # clippy 要编译 voice（cpal 的构建脚本找 ALSA 头文件）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      # rustfmt 只做机械格式，改了格式的提交单独一个 diff 也好审
      - name: 格式
        run: cargo fmt --all -- --check
      # 本地已经清零；新警告要当场修，不要靠 allow 堆过去
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 依赖漏洞
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  installer:
    name: 安装与更新回归
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: for script in install.sh scripts/*.sh; do bash -n "$script"; done
      - run: bash scripts/test-install.sh
      # 设置契约：spec/ 自检 + 设置界面对照（fcitx5 插件在「插件」任务的 addon-test.sh 里对照）
      - run: python3 scripts/test-config-contract.py

  settings:
    name: 设置界面（NSH） · ${{ matrix.arch }}
    # 无头 runner 偶发挂死（不是失败、不退出）：给这个任务一个上限，别让发版卡几小时
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
      - name: 系统依赖
        run: |
          sudo apt-get update
          # nsh 的 release runner 链着 GTK 4、GStreamer（sound）和 webkit6（webview：
          # javascriptcoregtk-6.0 + libsoup-3.0），还要 clang
          sudo apt-get install -y --no-install-recommends build-essential pkg-config clang \
            libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libwebkitgtk-6.0-dev \
            libjavascriptcoregtk-6.0-dev libsoup-3.0-dev ca-certificates curl
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # settings-nsh 是独立 workspace（自己的 [workspace]），target 在 settings-nsh/target；
      # rust-cache 默认只缓存仓库根的 target，不声明这里就会每次全量编译 nsh-core / nsh-base
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: settings-nsh
          key: settings-nsh-${{ matrix.arch }}
      # nsh CLI 不在 crates.io（那里是同名的旧库），用官方安装脚本取 GitHub 发布；
      # 80 MB 的包装一次缓存起来，版本变了 key 跟着变

      - uses: actions/cache@v4
        id: nsh-cli
        with:
          path: |
            ~/.nsh
            ~/.local/bin/nsh
          key: nsh-cli-${{ runner.os }}-${{ matrix.arch }}-v0.6.0
      - name: nsh
        env:
          NSH_VERSION: v0.6.0
        run: |
          if [ "${{ steps.nsh-cli.outputs.cache-hit }}" != "true" ]; then
            curl -fsSL https://nsh.dev/install.sh -o "$RUNNER_TEMP/nsh-install.sh"
            sh "$RUNNER_TEMP/nsh-install.sh"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 类型检查与无头测试
        working-directory: settings-nsh
        run: |
          nsh check
          # arm64 的 runner 上，无头应用第一次启动偶尔超过 open() 内置的 5 秒等待
          # （后面的测试 700ms 就起来了，说明是冷启动）：失败时再跑一次，第二次有系统缓存
          # timeout 兜底：无头 runner 偶发挂住（不报错也不退出），超时后当作失败重试
          timeout 600 nsh test || { echo "第一次 nsh test 失败或超时，重试一次"; timeout 600 nsh test; }
      - name: 版本号
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            base=$(scripts/version.sh)
            version="${base}~git$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: 打包
        run: scripts/package-settings-nsh.sh "$VERSION" dist/pkg
      - uses: actions/upload-artifact@v5
        with:
          name: settings-nsh-${{ matrix.arch }}
          path: dist/pkg/archtype-settings-nsh-*.tar.gz

  core:
    name: Rust 核心测试
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libx11-dev libxkbcommon-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: 五笔真码表（session_keys 的 wubi_real_table 用它）
        # 绝对路径：cargo test 的测试进程工作目录是包目录（core/），相对路径会找不到
        run: |
          scripts/make-wubi.sh "" "$PWD/dist/wubi"
          echo "ARCHTYPE_WUBI=$PWD/dist/wubi/wubi86.tsv" >> "$GITHUB_ENV"
      - name: Rust 测试
        run: cargo test --workspace --locked
      - name: C ABI 冒烟测试
        run: ./scripts/abi-smoke.sh

  data:
    name: 词库（rime-ice）
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: scripts/make-data.sh "" dist/data
      # 五笔 86 码表（rime-wubi，LGPL-3.0，钉死的提交）和许可证、作者、来源，和词库放在同一个目录
      - run: scripts/make-wubi.sh "" dist/data
      - name: Nix 包的词库版本
        # nix/package.nix 固定用某次发布页上的词库包。词库换了版本（rime-ice 更新或 REV 加一）时，
        # 新词库包要等这次发版后才有下载地址，所以这里只提醒；发版时 release job 会自动开 PR 改好（.github/scripts/nix-data-pr.sh）。
        run: |
          built=$(<dist/data/VERSION)
          pinned=$(sed -n 's/^ *dataVersion = "\(.*\)";/\1/p' nix/package.nix)
          if [ "$built" != "$pinned" ]; then
            echo "::warning title=Nix 词库版本落后::这次构建的词库是 $built，nix/package.nix 还固定在 $pinned。发版时会自动开 PR 更新。"
          fi
      - run: scripts/package-deb.sh data dist/data dist/pkg
      - uses: actions/upload-artifact@v5
        with:
          name: data
          path: dist/data
          retention-days: 7
      - uses: actions/upload-artifact@v5
        with:
          name: pkg-data
          path: dist/pkg

  # 可选的万象词库包（不进安装包，用户在设置里下载切换），随发布上传
  data-wanxiang:
    name: 词库（万象，可选）
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: scripts/make-wanxiang.sh "" dist/wanxiang dist/pkg
      - uses: actions/upload-artifact@v5
        with:
          name: data-wanxiang
          path: dist/wanxiang
          retention-days: 7
      - uses: actions/upload-artifact@v5
        with:
          name: pkg-data-wanxiang
          path: dist/pkg

  # 排序评测：用 data 任务的真实数据（rime-ice 词库 + words.lm + english.txt，两个外壳默认设置下的配置，
  # 不带神经语言模型）跑 tools/eval/ 下的全部用例。回归集 regress.tsv 必须全过；其余各组的 top1
  # （同音词组还有「通过」）比 tools/eval/baseline.tsv 低超过 0.5 个百分点就失败。汇总表在这次运行的 Summary 页。
  # 本地跑同一套、改了排序怎么更新基线：tools/eval/README.md。
  ranking-eval:
    name: 排序评测（真实词库）
    timeout-minutes: 30
    needs: data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v5
        with:
          name: data
          path: dist/data
      - name: 词库钉在基线记的 rime-ice 提交上
        # data 任务克隆的是 rime-ice 最新的提交。和基线记的不一样时，用基线那个提交重新生成词库
        # （words.lm 用 data 任务下载好的，不再下载），免得 rime-ice 一更新、排序没改也比不过基线
        run: |
          want=$(awk -F'\t' '$1 == "# 数据" { print $3 }' tools/eval/baseline.tsv)
          have=$(sed -n 's/^版本：\([0-9a-f]*\).*/\1/p' dist/data/SOURCE.txt)
          echo "基线的 rime-ice：${want:-没记}，data 任务的：${have:-不知道}"
          if [ -n "$want" ] && [ "$want" != "$have" ]; then
            git init -q "$RUNNER_TEMP/rime-ice"
            git -C "$RUNNER_TEMP/rime-ice" fetch -q --depth 1 https://github.com/iDvel/rime-ice.git "$want"
            git -C "$RUNNER_TEMP/rime-ice" checkout -q FETCH_HEAD
            # 评测不载入整句增强模型（eval.sh 只用 lexicon.tsv、words.lm、english.txt），不用再下载 nnlm.bin
            ARCHTYPE_NO_NNLM=1 ARCHTYPE_LM_FILE=dist/data/words.lm scripts/make-data.sh "$RUNNER_TEMP/rime-ice" dist/eval-data
            echo "EVAL_DATA=dist/eval-data" >> "$GITHUB_ENV"
          else
            echo "EVAL_DATA=dist/data" >> "$GITHUB_ENV"
          fi
      - name: 评测（回归集必须全过，其余各组和基线比）
        run: scripts/eval.sh "$EVAL_DATA"
      - name: 排序不变量（全部用例逐键打，一条都不许违反）
        # 「照着打的拼音不被纠错抢第一」「第一个音节的单字一直在」这类规则，见 docs/ENGINE-INVARIANTS.md。
        # 复用上一步编好的 archtype-eval；不带神经语言模型（data 任务不下载 nnlm.bin），带模型的本地跑：
        # scripts/invariants.sh <数据目录> --nnlm <nnlm.bin>
        if: ${{ !cancelled() }}
        env:
          ARCHTYPE_EVAL_BIN: target/release/archtype-eval
        run: scripts/invariants.sh "$EVAL_DATA"

  addon:
    name: 插件 · ${{ matrix.distro }} · ${{ matrix.arch }}
    timeout-minutes: 60
    needs: [data, data-wanxiang, settings]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro: [ubuntu24.04, ubuntu26.04, debian13, deepin25]
        include:
          - { distro: ubuntu24.04, image: "ubuntu:24.04" }
          - { distro: ubuntu26.04, image: "ubuntu:26.04" }
          - { distro: debian13, image: "debian:trixie" }
          - { distro: deepin25, image: "linuxdeepin/deepin:25" }
        exclude:
          # deepin 的容器镜像只有 amd64
          - { distro: deepin25, arch: arm64 }
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: 系统依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake extra-cmake-modules \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev libasound2-dev \
            fcitx5 fcitx5-modules \
            ca-certificates curl git dpkg-dev file python3
      - uses: actions/checkout@v5
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.distro }}-${{ matrix.arch }}
      - uses: actions/download-artifact@v5
        with:
          name: data
          path: dist/data
      - name: 按键测试（私有 fcitx5 实例 + 真实词库和语言模型）
        run: ARCHTYPE_LM="$PWD/dist/data/words.lm" scripts/addon-test.sh "$PWD/dist/data/lexicon.tsv" "$PWD/dist/data/english.txt"
      - uses: actions/download-artifact@v5
        if: matrix.distro == 'ubuntu26.04'
        with:
          name: data-wanxiang
          path: dist/wanxiang
      - name: 按键测试（万象词库）
        if: matrix.distro == 'ubuntu26.04'
        run: ARCHTYPE_LM="$PWD/dist/data/words.lm" scripts/addon-test.sh "$PWD/dist/wanxiang/lexicon.tsv" "$PWD/dist/data/english.txt"
      - name: 版本号
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            base=$(scripts/version.sh)
            version="${base}~git$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: NSH 设置界面
        uses: actions/download-artifact@v5
        with:
          name: settings-nsh-${{ matrix.arch }}
          path: dist/nsh
      - name: 打包
        run: |
          archive=$(ls dist/nsh/archtype-settings-nsh-*.tar.gz 2>/dev/null || true)
          if [ -n "$archive" ]; then
            ARCHTYPE_NSH_ARCHIVE="$archive" ARCHTYPE_DISTRO=${{ matrix.distro }} scripts/package-deb.sh engine "$VERSION" dist/pkg
          else
            ARCHTYPE_DISTRO=${{ matrix.distro }} scripts/package-deb.sh engine "$VERSION" dist/pkg
          fi
      - name: 用一键安装脚本装上试一下
        run: |
          mkdir -p /tmp/inst && cp dist/pkg/archtype_*.deb /tmp/inst/
          (cd /tmp/inst && sha256sum -- *.deb > SHA256SUMS)
          ARCHTYPE_VERSION="$VERSION" ARCHTYPE_BASE_URL=file:///tmp/inst ARCHTYPE_YES=1 ./install.sh
          # fcitx5 没在跑：脚本直接把 ArchType 写进 fcitx5 的输入法列表
          grep -qx 'Name=archtype' "$HOME/.config/fcitx5/profile"
          ls /usr/lib/*/fcitx5/libarchtype.so
          # 词库和语言模型在安装包里
          test -s /usr/share/archtype/words.lm && test -s /usr/share/archtype/english.txt
          cmp /usr/share/archtype/lexicon.tsv dist/data/lexicon.tsv
          cmp /usr/share/archtype/wubi86.tsv dist/data/wubi86.tsv
          # 整句增强模型：data 任务下载到了 nnlm.bin 就必须装上、和它一样；微信输入法的模型永远不许带
          if [ -f dist/data/nnlm.bin ]; then cmp /usr/share/archtype/nnlm.bin dist/data/nnlm.bin; fi
          if find /usr/share/archtype | grep -Ei 'nlrgpt2|wtlocal|wetype'; then
            echo "安装包里有不能分发的模型"; exit 1
          fi
          archtype-check --lexicon /usr/share/archtype/lexicon.tsv --s2t /usr/share/archtype/s2t.tsv
          archtype-show --lexicon /usr/share/archtype/lexicon.tsv nihao | tee /tmp/show.txt
          grep -q '1\.你好' /tmp/show.txt
          # 设置界面：能 import GTK 4 / libadwaita，拼音整理逻辑正确
          archtype-config --self-test
          # 图标装到 hicolor，输入法和设置界面都指向它
          test -f /usr/share/icons/hicolor/scalable/apps/archtype.svg
          test -f /usr/share/icons/hicolor/22x22/apps/archtype.png
          grep -qx 'Icon=archtype' /usr/share/fcitx5/inputmethod/archtype.conf
          # 插件清单要求编译时 fcitx5 的「主.次.0」，fcitx5 小版本落后一点的系统也能加载
          grep -qx "0=core:$(pkg-config --modversion Fcitx5Core | cut -d. -f1,2).0" /usr/share/fcitx5/addon/archtype.conf
      - uses: actions/upload-artifact@v5
        with:
          name: pkg-${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/pkg

  arch:
    name: 插件 · archlinux
    timeout-minutes: 40
    needs: [data, settings]
    runs-on: ubuntu-24.04
    # 固定到具体构建：latest 漂移会让「某天突然编不过」无法复现；刷新时改这里（hub 上是 base-devel-<日期>）
    container: archlinux:base-devel-20261108.0.623074
    defaults:
      run:
        shell: bash
    steps:
      - name: 系统依赖
        # rust 包自带 cargo；fcitx5 包含 CMake 配置和按键测试用的 testim 插件。
        # makepkg 不替我们装依赖：包的 depends（fcitx5-gtk、fcitx5-qt、python-gobject、gtk4、libadwaita）这里都要装上。
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake extra-cmake-modules \
            fcitx5 fcitx5-gtk fcitx5-qt alsa-lib rust pkgconf python git ca-certificates util-linux \
            gtk4 gtk4-layer-shell webkitgtk-6.0 gstreamer gst-plugins-base curl
          useradd --create-home builder
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: data
          path: dist/data
      - name: 按键测试（私有 fcitx5 实例 + 真实词库和语言模型）
        run: ARCHTYPE_LM="$PWD/dist/data/words.lm" scripts/addon-test.sh "$PWD/dist/data/lexicon.tsv" "$PWD/dist/data/english.txt"
      - name: 版本号
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            base=$(scripts/version.sh)
            version="${base}~git$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: NSH 设置界面
        uses: actions/download-artifact@v5
        with:
          name: settings-nsh-amd64
          path: dist/nsh
      - name: 用 makepkg 打 pacman 包（普通用户、从源码重建）
        run: |
          install -d -o builder -g builder dist/pkg
          archive=$(ls dist/nsh/archtype-settings-nsh-*.tar.gz 2>/dev/null || true)
          chmod -R a+rX dist/nsh 2>/dev/null || true
          runuser -u builder -- env ARCHTYPE_NSH_ARCHIVE="$archive" scripts/package-arch.sh "$VERSION" dist/pkg
      - name: 用一键安装脚本安装 Arch 包
        run: |
          # archlinux 容器的 pacman.conf 用 NoExtract 跳过了 /usr/share/doc 等，
          # 不去掉的话 pacman -Qkk 会把没解出来的文档当成文件缺失
          sed -i '/^NoExtract/d' /etc/pacman.conf
          (cd dist/pkg && sha256sum -- *.pkg.tar.zst > SHA256SUMS)
          ARCHTYPE_VERSION="$VERSION" ARCHTYPE_BASE_URL="file://$PWD/dist/pkg" ARCHTYPE_YES=1 ./install.sh
          pacman -Qip dist/pkg/archtype-*.pkg.tar.zst
          pacman -Qkk archtype
          test -f /usr/lib/fcitx5/libarchtype.so
          ldd /usr/lib/fcitx5/libarchtype.so | tee dist/ldd.txt
          if grep -q 'not found' dist/ldd.txt; then
            echo '插件有未解析的动态库依赖' >&2
            exit 1
          fi
          test -s /usr/share/archtype/words.lm
          test -s /usr/share/archtype/english.txt
          cmp /usr/share/archtype/lexicon.tsv dist/data/lexicon.tsv
          cmp /usr/share/archtype/words.lm dist/data/words.lm
          cmp /usr/share/archtype/wubi86.tsv dist/data/wubi86.tsv
          test -s /usr/share/licenses/archtype/LICENSE.rime-wubi
          # 整句增强模型：data 任务下载到了 nnlm.bin 就必须装上、和它一样；微信输入法的模型永远不许带
          if [ -f dist/data/nnlm.bin ]; then cmp /usr/share/archtype/nnlm.bin dist/data/nnlm.bin; fi
          if find /usr/share/archtype | grep -Ei 'nlrgpt2|wtlocal|wetype'; then
            echo "安装包里有不能分发的模型"; exit 1
          fi
          archtype-check --lexicon /usr/share/archtype/lexicon.tsv --s2t /usr/share/archtype/s2t.tsv
          # 不用 grep -q 直接接在管道后面，避免 pipefail 把上游 SIGPIPE 当成测试失败。
          archtype-show --lexicon /usr/share/archtype/lexicon.tsv nihao | tee dist/show.txt
          grep -q '1\.你好' dist/show.txt
          archtype-config --self-test
          test -f /usr/share/icons/hicolor/scalable/apps/archtype.svg
          test -f /usr/share/icons/hicolor/22x22/apps/archtype.png
          grep -qx 'Icon=archtype' /usr/share/fcitx5/inputmethod/archtype.conf
      - uses: actions/upload-artifact@v5
        with:
          name: pkg-archlinux
          path: dist/pkg/*.pkg.tar.zst
          if-no-files-found: error

  fedora:
    name: 插件 · fedora${{ matrix.version }} · ${{ matrix.arch }}
    timeout-minutes: 40
    needs: [data, settings]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: fedora:${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [43, 44, 45]
        arch: [x86_64, aarch64]
    defaults:
      run:
        shell: bash
    steps:
      - name: 系统依赖
        # fcitx5-devel 带 CMake 配置；fcitx5 带按键测试用的 testim 插件。
        # 设置界面（NSH）在安装后测试，它要 GTK 4 / WebKitGTK 6.0 / GStreamer 的运行库。
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rust cargo cmake extra-cmake-modules gcc-c++ pkgconf-pkg-config \
            fcitx5 fcitx5-devel alsa-lib-devel rpm-build gtk4-layer-shell-devel \
            python3 gtk4 webkitgtk6.0 gstreamer1 gstreamer1-plugins-base \
            git ca-certificates findutils file which curl
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: data
          path: dist/data
      - name: 语音浮条（编译 + 样式检查）
        # 编译 GTK 4 + layer-shell 浮条；tools/voice-overlay-check.sh 检查窗口背景透明的
        # CSS（GTK 不支持 !important、必须覆盖 window.background），防止四角露主题色复发。
        run: |
          cmake -S voice-overlay -B build-voice -DCMAKE_BUILD_TYPE=Release
          cmake --build build-voice -j"$(nproc)"
          tools/voice-overlay-check.sh
      - name: 按键测试（私有 fcitx5 实例 + 真实词库和语言模型）
        run: ARCHTYPE_LM="$PWD/dist/data/words.lm" scripts/addon-test.sh "$PWD/dist/data/lexicon.tsv" "$PWD/dist/data/english.txt"
      - name: 版本号
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            base=$(scripts/version.sh)
            version="${base}~git$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: NSH 设置界面
        uses: actions/download-artifact@v5
        with:
          name: settings-nsh-${{ matrix.arch == 'aarch64' && 'arm64' || 'amd64' }}
          path: dist/nsh
      - name: 用 rpmbuild 打 rpm 包（从源码重建）
        run: |
          archive=$(ls dist/nsh/archtype-settings-nsh-*.tar.gz 2>/dev/null || true)
          if [ -n "$archive" ]; then
            ARCHTYPE_NSH_ARCHIVE="$archive" scripts/package-rpm.sh "$VERSION" dist/pkg
          else
            scripts/package-rpm.sh "$VERSION" dist/pkg
          fi
      - name: 用一键安装脚本安装 Fedora 包
        run: |
          # fedora 容器的 dnf 默认 tsflags=nodocs，去掉免得 rpm -V 把没装的文档当成缺失
          sed -i '/^tsflags=nodocs/d' /etc/dnf/dnf.conf
          (cd dist/pkg && sha256sum -- *.rpm > SHA256SUMS)
          ARCHTYPE_VERSION="$VERSION" ARCHTYPE_BASE_URL="file://$PWD/dist/pkg" ARCHTYPE_YES=1 ./install.sh
          rpm -qip dist/pkg/archtype-*.rpm
          rpm -V archtype
          # Fedora 的 fcitx5 插件目录是 /usr/lib64/fcitx5
          test "$(pkg-config --variable=libdir Fcitx5Core)/fcitx5" = /usr/lib64/fcitx5
          test -f /usr/lib64/fcitx5/libarchtype.so
          ldd /usr/lib64/fcitx5/libarchtype.so | tee dist/ldd.txt
          if grep -q 'not found' dist/ldd.txt; then
            echo '插件有未解析的动态库依赖' >&2
            exit 1
          fi
          test -s /usr/share/archtype/words.lm
          test -s /usr/share/archtype/english.txt
          cmp /usr/share/archtype/lexicon.tsv dist/data/lexicon.tsv
          cmp /usr/share/archtype/words.lm dist/data/words.lm
          cmp /usr/share/archtype/wubi86.tsv dist/data/wubi86.tsv
          test -s /usr/share/licenses/archtype/LICENSE.rime-wubi
          # 整句增强模型：data 任务下载到了 nnlm.bin 就必须装上、和它一样；微信输入法的模型永远不许带
          if [ -f dist/data/nnlm.bin ]; then cmp /usr/share/archtype/nnlm.bin dist/data/nnlm.bin; fi
          if find /usr/share/archtype | grep -Ei 'nlrgpt2|wtlocal|wetype'; then
            echo "安装包里有不能分发的模型"; exit 1
          fi
          archtype-check --lexicon /usr/share/archtype/lexicon.tsv --s2t /usr/share/archtype/s2t.tsv
          # 不用 grep -q 直接接在管道后面，避免 pipefail 把上游 SIGPIPE 当成测试失败。
          archtype-show --lexicon /usr/share/archtype/lexicon.tsv nihao | tee dist/show.txt
          grep -q '1\.你好' dist/show.txt
          archtype-config --self-test
          # fcitx5 没在跑：直接把 ArchType 写进 fcitx5 的输入法列表
          archtype-config --add-to-group
          grep -qx 'Name=archtype' "$HOME/.config/fcitx5/profile"
          test -f /usr/share/icons/hicolor/scalable/apps/archtype.svg
          test -f /usr/share/icons/hicolor/22x22/apps/archtype.png
          grep -qx 'Icon=archtype' /usr/share/fcitx5/inputmethod/archtype.conf
      - uses: actions/upload-artifact@v5
        with:
          name: pkg-fedora${{ matrix.version }}-${{ matrix.arch }}
          path: dist/pkg/*.rpm
          if-no-files-found: error

  opensuse:
    name: 源码安装 · openSUSE Tumbleweed
    timeout-minutes: 40
    needs: data
    runs-on: ubuntu-24.04
    # tumbleweed 在 Docker Hub 上只有 latest（没有日期 tag），只能跟着滚动
    container: opensuse/tumbleweed:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 系统依赖
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends \
            rust cargo gcc-c++ make cmake extra-cmake-modules pkgconf-pkg-config \
            fcitx5 fcitx5-devel alsa-devel python3 python3-gobject python3-gobject-Gdk \
            typelib-1_0-Gtk-4_0 typelib-1_0-Adw-1 git ca-certificates file findutils
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: data
          path: dist/data
      - name: 编译并安装到系统 Fcitx 目录
        run: |
          cargo build --release --locked -p archtype-core -p archtype-config-cli
          cmake -S fcitx5-addon -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
          cmake --install build
          install -m755 target/release/archtype-check target/release/archtype-show /usr/bin/
          install -m644 dist/data/lexicon.tsv dist/data/english.txt dist/data/words.lm dist/data/wubi86.tsv /usr/share/archtype/
      - name: 插件路径、依赖、真实词库和设置界面
        run: |
          addon_dir="$(pkg-config --variable=libdir Fcitx5Core)/fcitx5"
          test -f "$addon_dir/libarchtype.so"
          ldd "$addon_dir/libarchtype.so" | tee dist/ldd.txt
          if grep -q 'not found' dist/ldd.txt; then exit 1; fi
          test -f /usr/share/fcitx5/addon/archtype.conf
          test -f /usr/share/fcitx5/inputmethod/archtype.conf
          archtype-check --lexicon /usr/share/archtype/lexicon.tsv --s2t /usr/share/archtype/s2t.tsv
          archtype-show --lexicon /usr/share/archtype/lexicon.tsv nihao | tee dist/show.txt
          grep -q '1\.你好' dist/show.txt
          archtype-config --self-test

  nix:
    # flake.lock 固定的是 nixos-unstable；用户一般用 inputs.nixpkgs.follows 跟自己系统的 nixpkgs，
    # 所以稳定版也要能编。新稳定版出来（每年 5 月、11 月）时把 nixos-26.05 换成新的。
    name: Nix · ${{ matrix.nixpkgs }} · ${{ matrix.system }}
    timeout-minutes: 40
    # 设置界面包用本轮 CI 自己打的（settings-nsh-*），不等发布页上的资产
    needs: [settings]
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nixpkgs: nixos-unstable, system: x86_64-linux }
          - { nixpkgs: nixos-unstable, system: aarch64-linux }
          - { nixpkgs: nixos-26.05, system: x86_64-linux }
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: 设置界面包（本轮 CI）
        uses: actions/download-artifact@v5
        with:
          name: settings-nsh-${{ matrix.system == 'aarch64-linux' && 'arm64' || 'amd64' }}
          path: dist/settings
      # 构建插件（词库按 flake 里固定的哈希从发布页下载，设置界面用上面这一步的包），再跑 checks：
      # 自检工具用装好的词库打出「你好」、设置界面自测
      - name: 构建并检查
        env:
          NIXPKGS: ${{ matrix.nixpkgs }}
        run: |
          override=()
          if [ "$NIXPKGS" != nixos-unstable ]; then
            override=(--override-input nixpkgs "github:NixOS/nixpkgs/$NIXPKGS")
          fi
          # flake.nix 在 --impure 下读这个变量，交给 package.nix 的 settingsArchive
          export ARCHTYPE_SETTINGS_ARCHIVE="$(ls "$PWD"/dist/settings/archtype-settings-nsh-*-linux-*.tar.gz | head -1)"
          test -f "$ARCHTYPE_SETTINGS_ARCHIVE"
          set -o pipefail
          # 先断言 settings 的真实来源是本地 artifact（本地包在 store 里叫 archtype-settings.tar.gz）
          settings_src=$(nix eval --impure --raw ".#default.settingsSource")
          echo "settings 来源: $settings_src"
          case "$settings_src" in
            */archtype-settings.tar.gz) ;;
            *)
              echo "settings 不是本地 artifact（$settings_src），settingsArchive 没接上" >&2
              exit 1
              ;;
          esac
          nix build .#default -L --impure "${override[@]}" 2>&1 | tee /tmp/nix-build.log
          nix flake check -L --impure "${override[@]}" 2>&1 | tee -a /tmp/nix-build.log
          # 再兜一层：没有从发布页下载设置界面包
          if grep -E 'downloading.*archtype-settings-nsh' /tmp/nix-build.log; then
            echo "设置界面包又去发布页下载了，本地 settingsArchive 没生效" >&2
            exit 1
          fi

  macos-app:
    # macOS 输入法外壳（macos/）：按键测试、打通用安装包、自检、真装一遍 pkg。
    # 设置界面是跨平台的 NSH app，随输入法包一起带（菜单「设置」打开）。
    name: macOS 输入法
    timeout-minutes: 45
    needs: [data]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v5
        with:
          name: data
          path: dist/data
      - name: nsh（跨平台设置界面）
        run: |
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=v0.6.0 sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - name: 共用外壳逻辑测试（按键、设置、引擎、会话）
        run: cargo test -p archtype-shell
      - name: macOS 外壳编译与测试
        run: cargo test --manifest-path macos-rs/Cargo.toml
      - name: 打包（含 NSH 设置 app）
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then export ARCHTYPE_VERSION=${GITHUB_REF_NAME#v}; fi
          macos/build.sh dist/data dist/macos
      - name: 检查安装包
        run: |
          app=dist/macos/ArchType.app
          bin=$app/Contents/MacOS/ArchType
          plutil -lint "$app/Contents/Info.plist"
          lipo "$bin" -verify_arch arm64 x86_64
          if otool -L "$bin" | grep -v ':$' | grep -Ev '^\s+(/System/Library/|/usr/lib/)'; then
            echo "链接了系统以外的库"; exit 1
          fi
          codesign --verify --strict "$app"
          [[ -d "$app/Contents/Resources/ArchType 设置.app" ]] || { echo "包没带设置 app"; exit 1; }
          unzip -l dist/macos/*.zip
          # 微信输入法的模型（nlrgpt2_nnlm.bin、wtlocal）不许带；nnlm.bin 是 ArchType 自己训的，可以带（build.sh 只放它进来）
          if unzip -l dist/macos/*.zip | grep -Ei 'wtlocal|nlrgpt2|gguf|HY-MT|wetype'; then
            echo "安装包里有不能分发的模型"; exit 1
          fi
      - name: 自检（载入安装包里的词库打 nihao）
        run: ARCHTYPE_DATA_DIR="$RUNNER_TEMP/archtype-data" dist/macos/ArchType.app/Contents/MacOS/ArchType --selftest
      - name: 自检以后安装包没被改过（词库快照要写在数据目录，不能写进签过名的安装包）
        run: codesign --verify --strict dist/macos/ArchType.app
      - name: 装一遍 pkg（只装给当前用户，不用 sudo）
        run: |
          pkg=$(ls dist/macos/ArchType-*-macos.pkg)
          pkgutil --payload-files "$pkg" | grep -qx './ArchType.app/Contents/MacOS/ArchType'
          if pkgutil --payload-files "$pkg" | grep -Ei 'wtlocal|nlrgpt2|gguf|HY-MT|wetype'; then
            echo "pkg 里有不能分发的模型"; exit 1
          fi
          xattr -w com.apple.quarantine "0083;00000000;Safari;" "$pkg"
          installer -pkg "$pkg" -target CurrentUserHomeDirectory
          app="$HOME/Library/Input Methods/ArchType.app"
          codesign --verify --strict "$app"
          if xattr -r "$app" | grep -q com.apple.quarantine; then echo "装出来的文件带隔离标记"; exit 1; fi
          [[ -O "$app/Contents/MacOS/ArchType" ]] || { echo "装出来的文件不归当前用户"; exit 1; }
          "$app/Contents/MacOS/ArchType" --version
      - uses: actions/upload-artifact@v5
        with:
          name: pkg-macos
          path: |
            dist/macos/*.zip
            dist/macos/*.pkg
          retention-days: 7

  windows:
    # Windows 输入法（TSF）：编译 COM DLL + archtype.exe，自检词库，注册/卸载注册表。
    name: Windows 输入法
    timeout-minutes: 30
    needs: [data]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/download-artifact@v5
        with:
          name: data
          path: dist/data
      - name: 编译（TSF DLL + archtype.exe，64 位 + 32 位）
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build --release --manifest-path win-rs/Cargo.toml
          cargo build --release --target i686-pc-windows-msvc --manifest-path win-rs/Cargo.toml
      - name: 自检（载入词库打 nihao）
        shell: pwsh
        run: |
          $env:ARCHTYPE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'archtype-data'
          $env:ARCHTYPE_RESOURCE_DIR = Join-Path $PWD 'dist\data'
          if ($LASTEXITCODE) { exit 1 }
          & .\win-rs\target\release\archtype.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw '自检失败' }
      - name: 注册与卸载（runner 是管理员）
        shell: pwsh
        run: |
          # reg query 失败是预期结果，别让 PowerShell 7.4 把它当错误退出
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = '.\win-rs\target\release\archtype.exe'
          $clsid = 'HKCR\CLSID\{6F2D3C1A-7B4E-4C2D-9E31-2A5B8F0C7D11}'
          $tip = 'HKLM\SOFTWARE\Microsoft\CTF\TIP\{6F2D3C1A-7B4E-4C2D-9E31-2A5B8F0C7D11}'
          & $exe --register
          if ($LASTEXITCODE -ne 0) { throw '注册失败' }
          reg query "$clsid\InprocServer32"
          if ($LASTEXITCODE -ne 0) { throw 'CLSID 没写进去' }
          reg query $tip
          if ($LASTEXITCODE -ne 0) { throw 'CTF TIP 没写进去' }
          & $exe --unregister
          if ($LASTEXITCODE -ne 0) { throw '卸载失败' }
          reg query $clsid *> $null
          if ($LASTEXITCODE -eq 0) { throw '卸载后 CLSID 还在' }
          # 最后一条 reg query 的失败码别带出这个步骤（GitHub Actions 的 pwsh 会 exit $LASTEXITCODE）
          exit 0

      # WiX v6/v7 要求接受 OSMF 的付费 EULA；v5 没有这个门槛，模板语法与 v4 相同
      - name: nsh（Windows 设置界面构建器）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://github.com/longbridge/nsh/releases/download/v0.6.0/install.ps1" -OutFile "$env:RUNNER_TEMP\nsh-install.ps1"
          & "$env:RUNNER_TEMP\nsh-install.ps1"
          # install.ps1 装到 %LOCALAPPDATA%\nsh，bin 在 PATH 里（当前进程要手动加）
          $nshDir = Join-Path $env:LOCALAPPDATA "nsh"
          $env:Path = "$(Join-Path $nshDir 'bin');$env:Path"
          $nsh = Get-ChildItem $nshDir -Recurse -Filter nsh.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsh) { throw "nsh.exe 没装上" }
          Write-Output "nsh: $($nsh.FullName)"
          & $nsh.FullName --version

      - name: 构建设置界面（Windows）
        shell: pwsh
        run: |
          $nshDir = Join-Path $env:LOCALAPPDATA "nsh"
          $nsh = (Get-ChildItem $nshDir -Recurse -Filter nsh.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Push-Location settings-nsh
          & $nsh package --target windows --app-version $version -o .nsh/out
          if ($LASTEXITCODE -ne 0) { throw "nsh package 失败" }
          Get-ChildItem .nsh/out -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          Pop-Location

      - name: WiX v5
        run: dotnet tool install --global wix --version 5.*

      - name: 打包 MSI
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $env:Path = "$env:USERPROFILE\.dotnet\tools;$env:Path"
          $settings = Get-ChildItem -Path "settings-nsh/.nsh/out" -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'nsh' } | Select-Object -First 1
          if (-not $settings) { throw "nsh 没产出设置界面 exe（settings-nsh/.nsh/out）" }
          ./scripts/package-msi.ps1 -Version $version -DataDir "dist/data" `
            -X86Dir "win-rs/target/i686-pc-windows-msvc/release" `
            -SettingsExe $settings.FullName -OutDir "dist/windows"

      - name: 装一遍 MSI 再卸掉（runner 是管理员）
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $msi = Get-ChildItem dist/windows/*.msi | Select-Object -First 1
          $log = "$env:RUNNER_TEMP\msi-install.log"
          $p = Start-Process msiexec.exe -ArgumentList @("/i", "`"$($msi.FullName)`"", "/qn", "/norestart", "/l*v", "`"$log`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "msiexec 安装失败：$($p.ExitCode)" }
          foreach ($f in @("archtype_tsf.dll", "archtype.exe", "lexicon.tsv", "words.lm")) {
            if (-not (Test-Path "C:\Program Files\ArchType\$f")) { throw "$f 没装进去" }
          }
          if (-not (Test-Path "C:\Program Files\ArchType\ArchType 设置.exe")) { throw "设置界面没装进去" }
          reg query "HKCR\CLSID\{6F2D3C1A-7B4E-4C2D-9E31-2A5B8F0C7D11}\InprocServer32"
          if ($LASTEXITCODE -ne 0) { throw "COM 注册没写进去" }
          reg query "HKLM\SOFTWARE\Microsoft\CTF\TIP\{6F2D3C1A-7B4E-4C2D-9E31-2A5B8F0C7D11}"
          if ($LASTEXITCODE -ne 0) { throw "CTF TIP 没写进去" }
          reg query "HKCR\CLSID\{6F2D3C1A-7B4E-4C2D-9E31-2A5B8F0C7D11}\InprocServer32" /reg:32
          if ($LASTEXITCODE -ne 0) { throw "32 位 COM 注册没写进去" }
          $p = Start-Process msiexec.exe -ArgumentList @("/x", "`"$($msi.FullName)`"", "/qn", "/norestart") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec 卸载失败：$($p.ExitCode)" }
          if (Test-Path "C:\Program Files\ArchType\archtype_tsf.dll") { throw "卸载后 DLL 还在" }
          reg query "HKCR\CLSID\{6F2D3C1A-7B4E-4C2D-9E31-2A5B8F0C7D11}" *> $null
          if ($LASTEXITCODE -eq 0) { throw "卸载后 COM 注册还在" }
          exit 0

      - uses: actions/upload-artifact@v5
        with:
          name: msi-windows
          path: dist/windows/*.msi
          retention-days: 7

  release:
    name: 发布
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, installer, core, data, data-wanxiang, ranking-eval, addon, arch, fedora, opensuse, nix, macos-app, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 版本号与 tag 一致
        run: |
          manifest=$(scripts/version.sh)
          tag=${GITHUB_REF_NAME#v}
          if [ "$manifest" != "$tag" ]; then
            echo "core/Cargo.toml 的版本是 $manifest，tag 是 $tag；发版前先把 core/Cargo.toml 改成 tag 版本" >&2
            exit 1
          fi
      - name: 正式版还是预发布
        # tag 打在 main 上的提交 → 正式版（成为 Latest，所有人的检查更新和一键安装都会拿到）；
        # 打在别处（比如 pre-release 分支）→ GitHub 的 pre-release：检查更新和 install.sh 只认 releases/latest，
        # 不会推给普通用户，要装得写 ARCHTYPE_VERSION。测完转正：合进 main 后
        # gh release edit <tag> --prerelease=false --latest（release 分支、Nix 词库 PR 这时手动补，见 docs/INSTALL.md）。
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "PRERELEASE=" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=1" >> "$GITHUB_ENV"
            echo "::notice title=预发布::$GITHUB_REF_NAME 不在 main 上，发成 pre-release"
          fi
      - uses: actions/download-artifact@v5
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          pattern: settings-nsh-*
          path: dist/settings
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          name: msi-windows
          path: dist/windows
      - name: 校验和
        run: |
          cd dist
          # 某一类包没产出时，裸 glob 会被当成文件名：用数组 + nullglob，并确认至少有一个
          shopt -s nullglob
          files=(*.deb *.rpm *.pkg.tar.zst *.tar.gz)
          ((${#files[@]})) || { echo "没有可发布的包" >&2; exit 1; }
          sha256sum -- "${files[@]}" > SHA256SUMS
          (cd settings && files=(*.tar.gz) && ((${#files[@]})) && sha256sum -- "${files[@]}") >> SHA256SUMS
          (cd windows && files=(*.msi) && ((${#files[@]})) && sha256sum -- "${files[@]}") >> SHA256SUMS
          cat SHA256SUMS
      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 「这一版要注意」每次发版前写上这一版的变化（旧设置界面发完就删，见 0.6.1）
          cat > notes.md <<EOF
          ## 这一版要注意

          - **双拼简拼（默认开）**：只打声母也出词，\`sm\` → 什么；同样的键按双拼也读得通时，双拼读出来的排在前面。设置「输入 → 双拼简拼」可以关。
          - **逐键提速**：万象、雾凇这些大词库下乱按长串，p99 从 21 ms 降到 8 ms 左右，日常整句约快一倍，候选一个不变。
          - **最近常选的字可以当首选**：选过很多次的单字，打得比第一个候选多一倍以上时排到第一。
          - **排序不变量**：纠错、模糊音、简拼、补全只往后加候选，不会把照着打的拼音和第一个音节的单字挤掉。
          - **换窗口时的默认中/英文**（#254）：设置「输入 → 默认中/英文」可选和上次一样 / 中文 / 英文；换到新窗口、新应用时按它定一次，在窗口里用 Shift 切了只算这一次。
          - **双击 Shift 不切换中英文**（#253）：JetBrains 的双击 Shift（到处搜索）不再被输入法杀掉；单按 Shift 仍照旧切换（0.35 秒内按两下不算）。
          - **数字后面的标点**：顿号、问号、圆括号是中文标点（\`1、\`、\`（1）\`），小数点、千分位、时间这些仍是半角（\`3.14\`、\`3,000\`、\`20:22\`）。
          - **连不上 GitHub 也能装**：一键安装支持 \`ARCHTYPE_GITHUB_MIRROR=https://<代理>/\` 走自己选的下载代理，连不上时提示从 jsDelivr 取脚本；安装包照样按 SHA256SUMS 校验。
          - 源码里新增 Wayland 语音浮条（\`voice-overlay/\`，GTK 4 + layer-shell）：非 GNOME 桌面（niri、sway 等）也能看到蓝话筒 + 声波浮条，需自行构建运行。
          - **Windows 版（实验）**：新增 TSF 输入法（\`win-rs/\`）与 MSI——编辑区（composition）、候选窗口（GDI 自绘、点选）、语音（激活时与全局热键）、统计、配置热重载、\`--mode\`、词库包、密码框不学习、更新检查/安装。还没做真机交互验收，遇到问题请在 issue 里贴宿主应用与现象。

          ## 安装（Ubuntu / Debian、deepin、Arch Linux、Fedora、NixOS）

          一行命令（下载对应发行版的安装包、装好、加进 fcitx5 输入法列表）：

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash
          \`\`\`

          或者手动下载和你系统对应的一个 \`archtype_<版本>_<发行版>_<架构>.deb\`（词库已经在包里），然后 \`sudo apt install ./archtype_*.deb\`。
          Ubuntu / Debian 的 deb 和 Fedora RPM 有 x86_64（amd64）和 arm64（aarch64）两种，一键脚本按本机架构选；Arch 包和 deepin 包只有 x86_64。
          Arch Linux / EndeavourOS / Garuda / CachyOS：一键脚本用 pacman 安装对应包，不替你整机升级；依赖装不上时按提示先运行 \`sudo pacman -Syu\`。
          Fedora 43 / 44 / 45：自动选择与系统版本一致的 RPM。Debian 13、Ubuntu 24.04 / 26.04 及明确声明兼容基线的衍生版、deepin 25 使用对应 deb。
          Manjaro：按安装说明在本机用 makepkg 打包；openSUSE Tumbleweed：按安装说明从源码构建。
          NixOS（x86_64、aarch64）：flake 输入写 \`github:${GITHUB_REPOSITORY}/release\`（跟正式版）或 \`github:${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}\`（锁这一版），把 \`inputs.archtype.packages.<system>.default\` 加进 \`i18n.inputMethod.fcitx5.addons\`，见[安装说明](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL.md#nixos--nix)。
          完整步骤见 [README](https://github.com/${GITHUB_REPOSITORY}#安装)。

          安装包里的词库来自 [rime-ice](https://github.com/iDvel/rime-ice)（GPL-3.0），词频另用了 [Tatoeba](https://tatoeba.org) 的中文句子（CC BY 2.0 FR）统计，词级语言模型 words.lm 和整句增强模型 nnlm.bin 是 CC BY-SA 4.0；详见安装包里的 DATA-SOURCE.txt。
          五笔 86 码表 wubi86.tsv 来自 [rime-wubi](https://github.com/rime/rime-wubi)（LGPL-3.0），作者和钉死的提交见随包的 WUBI-AUTHORS、WUBI-SOURCE.txt。

          可选词库：\`archtype-data-wanxiang-*.tar.gz\` 是从[万象拼音](https://github.com/amzxyz/rime_wanxiang)（CC BY 4.0）转换的词库，不在安装包里。
          想用的话在「ArchType 设置 → 输入 → 词库」里选「万象拼音」并下载，或运行 \`archtype-config --install-lexicon wanxiang\`；随时可以切回默认的雾凇。

          EOF
          extra=()
          # 「这一版要注意」单独传一份（RELEASE-NOTES.md）：各端检查更新从这里取更新说明，不用问 GitHub 接口
          awk '/^## 这一版要注意/{on=1} on && /^## / && !/^## 这一版要注意/{exit} on' notes.md > dist/RELEASE-NOTES.md
          grep -q '^## 这一版要注意' dist/RELEASE-NOTES.md
          if [ -n "$PRERELEASE" ]; then
            extra=(--prerelease --latest=false)
            { printf '> **预发布，测试用。** 检查更新和一键安装不会装它；要装就在一键命令前加 `ARCHTYPE_VERSION=%s`：\n>\n' "$GITHUB_REF_NAME"
              printf '> ```bash\n> curl -fsSL https://raw.githubusercontent.com/%s/%s/install.sh | ARCHTYPE_VERSION=%s bash\n> ```\n\n' \
                "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF_NAME"
              cat notes.md; } > notes.pre && mv notes.pre notes.md
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.tar.gz dist/SHA256SUMS \
            dist/*.zip dist/*.pkg \
            dist/settings/*.tar.gz dist/windows/*.msi dist/RELEASE-NOTES.md \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ArchType $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes "${extra[@]}"
      - name: 通知 Telegram 群
        # GITHUB_TOKEN 发的 release 不会触发 telegram-notify.yml，所以在这里直接发。
        # 没配置 TELEGRAM_CHAT_ID 就跳过；发送失败也不算发版失败。
        if: vars.TELEGRAM_CHAT_ID != '' && env.PRERELEASE == ''
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ vars.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: release
          R_TAG: ${{ github.ref_name }}
        run: node .github/scripts/tg-notify.mjs
      - name: 更新 release 分支（NixOS 用户跟这个分支拿正式版）
        # GITHUB_TOKEN 不能把分支移到改过 .github/workflows 的提交上；两次发版之间改过 CI，就要
        # RELEASE_BRANCH_TOKEN（细粒度 PAT：Contents、Workflows 读写）。没配置或失败只提醒，不算发版失败。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BRANCH_TOKEN || github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name)
          if [ "$latest" != "$GITHUB_REF_NAME" ]; then
            echo "$GITHUB_REF_NAME 不是最新版（最新是 $latest），release 分支不动"
            exit 0
          fi
          sha=$(git rev-parse HEAD)
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/release" > /dev/null 2>&1; then
            ok=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/release" -f sha="$sha" -F force=true -q .object.sha || true)
          else
            ok=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/release -f sha="$sha" -q .object.sha || true)
          fi
          if [ "$ok" != "$sha" ]; then
            echo "::warning title=release 分支没更新::在本机运行 git push --force origin $GITHUB_REF_NAME^{commit}:refs/heads/release，或配置 RELEASE_BRANCH_TOKEN（见 docs/INSTALL.md）"
            exit 1
          fi
          echo "release 分支 → $GITHUB_REF_NAME（$sha）"
      - name: Nix 词库跟上这一版
        # 这一版换了词库，就把 nix/package.nix 改好开 PR 到 main（开不了 PR 时退回开 issue），见脚本开头
        if: env.PRERELEASE == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/nix-data-pr.sh \
            dist/archtype-data-rime-ice-*.tar.gz \
            dist/settings/archtype-settings-nsh-*-linux-x86_64.tar.gz \
            dist/settings/archtype-settings-nsh-*-linux-aarch64.tar.gz
