[package]
name = "archtype-core"
version.workspace = true
edition = "2021"
rust-version = "1.79"
description = "WeType 风格拼音输入法引擎骨架（音节图 + 束搜索 + 排序）"
license.workspace = true

[lib]
name = "archtype_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "archtype-demo"
path = "src/bin/demo.rs"

[[bin]]
name = "archtype-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "archtype-eval"
path = "src/bin/eval.rs"

[[bin]]
name = "archtype-check"
path = "src/bin/check.rs"

[[bin]]
name = "archtype-train"
path = "src/bin/train.rs"

[[bin]]
name = "archtype-show"
path = "src/bin/show.rs"

[[bin]]
name = "archtype-lmbuild"
path = "src/bin/lmbuild.rs"

[[bin]]
name = "archtype-probe"
path = "src/bin/probe.rs"

[dependencies]
anyhow = "1.0"
# 翻译：拼 OpenAI 格式的请求、解析流式返回
serde_json = "1"
# 语音输入（麦克风 + 微信离线识别模型）。Linux 需要 libasound2-dev
archtype-voice = { path = "../voice", features = ["capture"], optional = true }

[target.'cfg(unix)'.dependencies]
# 会话读本地时间（日期时间候选）；libc 只在 unix 平台用到
libc = "0.2"

[features]
# 默认带语音：core 的构建者因此要装音频开发包（Linux 是 libasound2-dev，cpal 的其它平台各有对应依赖）。
# 不需要语音的下游可以用 default-features = false。
default = ["voice"]
voice = ["dep:archtype-voice"]
